<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ragbot · 可溯源知识问答</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f0f4f2;
      --surface: #ffffff;
      --ink: #18323b;
      --quiet: #526a72;
      --deep: #173c47;
      --source: #287584;
      --source-bg: #e4eff0;
      --alert: #a45d32;
      --alert-bg: #f8eee7;
      --deny: #9b4342;
      --deny-bg: #f7eaea;
      --rule: #cbdadd;
      --ok: #8fc6a8;
      --sans: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
      --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--paper); color: var(--ink); font: 14px/1.7 var(--sans); }
    button, input { font: inherit; }
    button { cursor: pointer; border: none; border-radius: 10px; }
    :focus-visible { outline: 3px solid var(--source); outline-offset: 2px; }

    .layout { display: flex; height: 100vh; }
    /* ---- 侧栏 ---- */
    .sidebar { width: 230px; flex: 0 0 230px; background: var(--deep); color: #dcebec;
               display: flex; flex-direction: column; }
    .brand { padding: 24px 22px 18px; border-bottom: 1px solid rgba(255,255,255,.12); }
    .brand .name { font: 700 21px/1.2 var(--serif); letter-spacing: .05em; color: #f4fafb; }
    .brand .tag { font: 500 12px/1.4 var(--sans); color: #9fc3cb; margin-top: 4px; }
    .nav { flex: 1; padding: 14px 0; }
    .nav a { display: block; padding: 12px 22px; color: #c3d8db; text-decoration: none;
             font-size: 13.5px; border-left: 3px solid transparent; }
    .nav a.active { background: rgba(255,255,255,.08); color: #f4fafb; border-left-color: var(--source); }
    .nav a:hover { color: #f4fafb; }
    .nav .group-label { padding: 12px 22px 4px; font-size: 11px; color: #7ea6ad; letter-spacing: .12em; }
    .side-foot { padding: 16px 22px; font-size: 11.5px; color: #8fb0b6;
                 border-top: 1px solid rgba(255,255,255,.12); line-height: 1.8; }

    /* ---- 主区 ---- */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--rule);
              padding: 13px 30px; display: flex; align-items: center; justify-content: space-between; }
    .topbar .title { font: 700 16px/1.3 var(--serif); color: var(--deep); }
    .topbar .status { font-size: 12px; color: var(--quiet); display: flex; align-items: center; gap: 7px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }

    .thread { flex: 1; overflow-y: auto; padding: 30px 34px 16px; }
    .hero { text-align: center; padding: 40px 0 24px; }
    .hero h1 { font: 700 clamp(24px, 2.6vw, 34px)/1.3 var(--serif); color: var(--deep);
               letter-spacing: -.02em; margin: 0 0 10px; }
    .hero p { color: var(--quiet); font-size: 13.5px; margin: 0 0 6px; }
    .hero .kicker { font-size: 11px; letter-spacing: .28em; color: var(--source); margin-bottom: 14px; }
    .examples { text-align: center; margin: 18px 0 8px; }
    .examples span { display: inline-block; margin: 3px 5px; padding: 5px 15px; font-size: 12.5px;
                     background: var(--surface); border: 1px solid var(--rule); color: var(--source);
                     border-radius: 18px; cursor: pointer; transition: border-color .15s; }
    .examples span:hover { border-color: var(--source); }

    /* ---- 对话消息 ---- */
    .msg { margin-bottom: 22px; display: flex; }
    .msg.user { justify-content: flex-end; }
    .msg.user .stack { max-width: 72%; text-align: right; }
    .msg.user .who { font-size: 11px; color: var(--quiet); margin-bottom: 5px; }
    .msg.user .bubble { display: inline-block; text-align: left; background: var(--deep);
                        color: #f4fafb; border-radius: 14px 14px 4px 14px;
                        padding: 11px 17px; white-space: pre-wrap; }
    .msg.ai .stack { max-width: 86%; }
    .msg.ai .who { font-size: 11px; color: var(--quiet); margin-bottom: 5px;
                   display: flex; align-items: center; gap: 7px; }
    .msg.ai .who .ai-mark { width: 20px; height: 20px; border-radius: 6px; background: var(--source);
                            color: #fff; font-size: 11px; display: inline-flex;
                            align-items: center; justify-content: center; font-weight: 700; }
    .msg.ai .bubble { background: var(--surface); border: 1px solid var(--rule);
                      border-radius: 4px 14px 14px 14px; padding: 13px 17px; white-space: pre-wrap; }
    .cursor { display: inline-block; width: 7px; height: 15px; background: var(--source);
              vertical-align: -2px; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .badge { display: inline-block; padding: 2px 12px; border-radius: 16px; font-size: 12px;
             font-weight: 600; margin-bottom: 8px; }
    .b-answered { background: var(--source-bg); color: var(--source); }
    .b-conflict { background: var(--alert-bg); color: var(--alert); }
    .b-insufficient_evidence { background: var(--deny-bg); color: var(--deny); }

    .cits { margin-top: 13px; border-top: 1px dashed var(--rule); padding-top: 11px; }
    .cits .cits-title { font-size: 12px; font-weight: 600; color: var(--deep); margin-bottom: 7px; }
    .cit { background: var(--source-bg); border-left: 3px solid var(--source);
           border-radius: 0 8px 8px 0; padding: 7px 12px; margin-bottom: 7px; font-size: 13px; }
    .cit .loc { color: var(--quiet); font-size: 12px; }
    .cit .exc { margin-top: 2px; }
    .cit.role-pointer { border-left-color: #7a9e46; background: #eef3e2; }
    .cit.role-inherited { border-left-color: #b08c3e; background: #f7f1df; }
    .meta-line { font-size: 11.5px; color: var(--quiet); margin-top: 10px; }
    .notice { font-size: 12px; color: var(--alert); margin-top: 6px; }
    .no-cit { color: var(--quiet); font-size: 12px; }

    .error-box { background: var(--deny-bg); color: var(--deny); padding: 9px 14px;
                 border-radius: 10px; font-size: 13px; margin-bottom: 16px; }

    /* ---- 输入区 ---- */
    .composer { border-top: 1px solid var(--rule); background: var(--surface); padding: 14px 30px 16px; }
    .row { display: flex; gap: 10px; }
    .row input[type=text]#q { flex: 1; padding: 12px 15px; border: 1px solid var(--rule);
                              border-radius: 11px; font-size: 14px; outline: none; background: var(--paper); }
    .row input[type=text]#q:focus { border-color: var(--source); background: var(--surface); }
    .row .opt { width: 148px; padding: 10px 11px; border: 1px solid var(--rule); border-radius: 11px;
                font-size: 13px; color: var(--quiet); outline: none; background: var(--paper); }
    .row .opt:focus { border-color: var(--source); }
    .row button { padding: 12px 28px; background: var(--source); color: #fff; font-size: 14px; }
    .row button:hover { background: var(--deep); }
    .row button:disabled { opacity: .5; cursor: wait; }
    .hint { font-size: 11.5px; color: var(--quiet); margin-top: 8px; }

    @media (max-width: 900px) {
      .sidebar { display: none; }
      .msg.user .stack, .msg.ai .stack { max-width: 100%; }
      .row .opt { width: 120px; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="name">ragbot</div>
      <div class="tag">可溯源制度知识问答</div>
    </div>
    <nav class="nav">
      <div class="group-label">工作区</div>
      <a href="#" class="active">问答对话</a>
      <a href="/workbench.html">证据工作台</a>
      <div class="group-label">参考</div>
      <a href="#" title="规划中">版本与冲突说明</a>
      <a href="#" title="规划中">导入与评测</a>
    </nav>
    <div class="side-foot">
      检索 · 裁决 · 引用均由确定性引擎产出<br>
      模型仅润色表述，可回退模板路径
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="title">问答对话</div>
      <div class="status"><span class="dot"></span>就绪 · 回答基于实际导入的资料</div>
    </div>

    <div class="thread" id="thread">
      <div class="hero">
        <div class="kicker">TRACEABLE ANSWERS</div>
        <h1>有出处，才可信。</h1>
        <p>每条回答由确定性引擎产出引用，逐字摘录可核验；证据不足即拒答，不捏造出处。</p>
      </div>
      <div class="examples" id="examples">
        <span onclick="fill('现在申请要交哪些材料')">现在申请要交哪些材料</span>
        <span onclick="fill('艺术节专项经费最多能补多少钱')">经费补助上限（冲突）</span>
        <span onclick="fill('星河工作坊在哪里举办')">星河工作坊在哪里举办</span>
        <span onclick="fill('2025年申请艺术节要准备几项材料')">2025年要几项材料</span>
        <span onclick="fill('艺术节可以带宠物入场吗')">可以带宠物吗（拒答）</span>
      </div>
    </div>

    <div class="composer">
      <div class="row">
        <input type="text" id="q" placeholder="输入问题，例如：现在申请要交哪些材料"
               onkeydown="if(event.key==='Enter')ask()">
        <input type="text" class="opt" id="scope" placeholder="适用范围键（可选）">
        <button id="btn" onclick="ask()">发送</button>
      </div>
      <div class="hint">时间点由模型从问句自动识别并注入检索，无需手选。模型启用时先核验完整改写再显示回答；模型不可用时回退确定性模板。</div>
      <div id="err" class="error-box" hidden></div>
    </div>
  </main>
</div>

<script>
const STATUS_TEXT = {
  answered: '已回答 · 有出处',
  conflict: '检测到冲突 · 请人工核实',
  insufficient_evidence: '证据不足 · 已拒答'
};
const ROLE_TEXT = { current_pointer: '现行声明', inherited_clause: '沿用条款' };

const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fill = q => { el('q').value = q; ask(); };
const scrollBottom = () => { const t = el('thread'); t.scrollTop = t.scrollHeight; };

function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = '<div class="stack"><div class="who">用户</div>' +
                  '<div class="bubble">' + esc(text) + '</div></div>';
  el('thread').appendChild(div);
  scrollBottom();
}

function addAiMsg() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<div class="stack">' +
    '<div class="who"><span class="ai-mark">AI</span>ragbot</div>' +
    '<div class="bubble"><span class="cursor"></span></div></div>';
  el('thread').appendChild(div);
  scrollBottom();
  return div;
}

async function ask() {
  const q = el('q').value.trim();
  
  const scope = el('scope').value.trim();
  el('err').hidden = true;
  if (!q) return;

  const btn = el('btn');
  btn.disabled = true; btn.textContent = '检索中…';
  addUserMsg(q);
  const ai = addAiMsg();
  const bubble = ai.querySelector('.bubble');
  const stack = ai.querySelector('.stack');
  let aiText = '';

  try {
    const resp = await fetch('/api/ask/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query: q, scope_key: scope})
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({error: resp.statusText}));
      throw new Error(e.error || '请求失败');
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let cits = null, genBy = 'template', notice = '', detected = false;

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const frames = buf.split('\n\n');
      buf = frames.pop();
      for (const frame of frames) {
        let event = 'message', data = '';
        for (const l of frame.split('\n')) {
          if (l.startsWith('event: ')) event = l.slice(7).trim();
          else if (l.startsWith('data: ')) data += l.slice(6);
        }
        if (!data) continue;
        let p;
        try { p = JSON.parse(data); } catch { continue; }

        if (event === 'meta') {
          cits = p.citations; detected = !!p.detected;
          const badge = document.createElement('span');
          badge.className = 'badge b-' + p.status;
          badge.textContent = STATUS_TEXT[p.status] || p.status;
          bubble.insertBefore(badge, bubble.firstChild);
          scrollBottom();
        } else if (event === 'delta') {
          aiText += p.text;
          let tn = bubble.querySelector('.answer-text');
          if (!tn) {
            tn = document.createElement('span');
            tn.className = 'answer-text';
            bubble.insertBefore(tn, bubble.querySelector('.cursor'));
          }
          tn.textContent = aiText;
          scrollBottom();
        } else if (event === 'notice') {
          notice = p.fallback_reason || '';
        } else if (event === 'done') {
          genBy = p.generated_by || genBy;
          const cur = bubble.querySelector('.cursor');
          if (cur) cur.remove();

          const box = document.createElement('div');
          box.className = 'cits';
          if (cits && cits.length) {
            box.innerHTML = '<div class="cits-title">出处（' + cits.length + ' 条 · 逐字摘录可核验）</div>' +
              cits.map(c =>
                '<div class="cit ' + (c.role ? 'role-' + esc(c.role) : '') + '">' +
                '<div class="loc">《' + esc(c.document_id) + '》' + esc(c.version) +
                ' · ' + esc(c.location) + (ROLE_TEXT[c.role] ? ' · ' + ROLE_TEXT[c.role] : '') +
                '</div><div class="exc">"' + esc(c.excerpt) + '"</div></div>').join('');
          } else {
            box.innerHTML = '<div class="cits-title">出处</div>' +
              '<div class="no-cit">无（拒答不捏造出处）</div>';
          }
          const m = document.createElement('div');
          m.className = 'meta-line';
          m.textContent = '总耗时 ' + p.total_ms + 'ms · 表述来源 ' + genBy +
            (detected ? ' · 已从问句识别历史时间点' : '');
          stack.appendChild(box);
          stack.appendChild(m);
          if (notice) {
            const n = document.createElement('div');
            n.className = 'notice';
            n.textContent = '模型表述不可用，已回退确定性模板：' + notice;
            stack.appendChild(n);
          }
          scrollBottom();
        }
      }
    }
    const cur = bubble.querySelector('.cursor');
    if (cur) cur.remove();
  } catch (e) {
    const errBox = document.createElement('div');
    errBox.className = 'error-box';
    errBox.textContent = e.message;
    el('thread').appendChild(errBox);
    scrollBottom();
  } finally {
    btn.disabled = false; btn.textContent = '发送';
    scrollBottom();
  }
}
</script>
</body>
</html>
